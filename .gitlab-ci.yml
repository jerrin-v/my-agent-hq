# Publishes the site with GitLab Pages on every push to the default branch.
pages:
  image: alpine:3.20
  stage: deploy
  script:
    - mkdir -p public
    - cp -r index.html roster.json versions public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
