<style>html,body{margin:0;height:100%;background:#04060A}[hidden]{display:none!important}

  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);-webkit-tap-highlight-color:transparent;touch-action:manipulation}

<body>
<!-- Sign-in page for the GitHub Pages copy of Claude HQ (built by tools/encrypt-site.mjs).
     The page and its data are AES-256-GCM encrypted with a key derived from the site password
     (PBKDF2-SHA256, 600 000 rounds); nothing readable is served until the right code is entered. -->
<div id="hqLock" role="dialog" aria-modal="true" aria-labelledby="hqlTitle">
  <div class="hql-panel">
    <div class="hql-head">Access <span>control</span><i aria-hidden="true"></i></div>
    <div class="hql-body">
      <div class="hql-brand">
        <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#1E2023" stroke="#5A5E64" stroke-width="2"/><circle cx="24" cy="24" r="17" stroke="#8C9298" stroke-width="1"/><path d="M24 9l12 7v16l-12 7-12-7V16z" stroke="#ECEAE4" stroke-width="1.6"/><path d="M24 15l7 4v10l-7 4-7-4V19z" fill="#F58025"/><path d="M2 24h6M40 24h6M24 2v6M24 40v6" stroke="#ECEAE4" stroke-opacity=".5"/></svg>
        <div><b>Claude HQ</b><span class="hql-mono">Bridge floor 01 · Restricted</span></div>
      </div>
      <h1 class="hql-title" id="hqlTitle">Enter clearance code</h1>
      <span class="hql-mono" id="hqlHint">6-digit code to open the floor</span>
      <div class="hql-cells" id="hqlCells">
        <div class="hql-cell"></div><div class="hql-cell"></div><div class="hql-cell"></div>
        <div class="hql-cell"></div><div class="hql-cell"></div><div class="hql-cell"></div>
        <input id="hqlCode" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="current-password" aria-label="Clearance code, 6 digits" aria-describedby="hqlStatus">
      </div>
      <form class="hql-pwrow" id="hqlPwForm" autocomplete="on">
        <input id="hqlPw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" aria-describedby="hqlStatus">
        <button type="submit" id="hqlPwGo" aria-label="Unlock"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10h11M11 5l5 5-5 5"/></svg></button>
      </form>
      <p class="hql-status hql-mono" id="hqlStatus" role="status" aria-live="polite">Awaiting code</p>
      <div class="hql-pad" id="hqlPad">
        <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
        <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
        <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
        <button type="button" data-k="del" aria-label="Delete last digit"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 4h10v12H7l-5-6z"/><path d="M10 7.5l5 5M15 7.5l-5 5"/></svg></button>
        <button type="button" data-k="0">0</button>
        <button type="button" data-k="go" class="go" aria-label="Unlock" disabled><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10h11M11 5l5 5-5 5"/></svg></button>
      </div>
      <label class="hql-rem hql-mono"><input type="checkbox" id="hqlRem"> Remember me for today</label>
    </div>
  </div>
  <p class="hql-built hql-mono" id="hqlBuilt"></p>
</div>
<script id="hqPayload" type="application/json">/*PAYLOAD*/</script>
<script>
/* Unlock: derive the key from the code (PBKDF2-SHA256), decrypt the page, write it in place.
   A sign-in lasts for this tab (sessionStorage); "Remember me for today" keeps it until local midnight.
   Add ?signout to the address to sign out. A new build (new salt) or a new password signs everyone out. */
(() => {
  'use strict';
  const P = JSON.parse(document.getElementById('hqPayload').textContent);
  const SK = 'hq_gh_key', RK = 'hq_gh_rem';
  const $ = id => document.getElementById(id);
  const lock = $('hqLock'), field = $('hqlCode'), cells = [...lock.querySelectorAll('.hql-cell')], status = $('hqlStatus');
  const goBtn = lock.querySelector('[data-k="go"]'), pw = $('hqlPw'), pwGo = $('hqlPwGo'), rem = $('hqlRem');
  const codeMode = P.m === 'code', coarse = matchMedia('(pointer: coarse)').matches;
  const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!codeMode) { lock.classList.add('mode-pw'); $('hqlTitle').textContent = 'Enter password'; $('hqlHint').textContent = 'Password to open the floor'; }

  /* small "vX · Published <local date · time>" stamp */
  const bt = Date.parse(P.t);
  if (Number.isFinite(bt)) { const d = new Date(bt), p2 = n => String(n).padStart(2, '0');
    $('hqlBuilt').textContent = (P.v ? P.v + ' · ' : '') + 'Published ' + d.getDate() + ' ' + d.toLocaleString('en-GB', { month:'short' }) + ' ' + d.getFullYear() + ' · ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }

  const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64 = a => { let s = ''; for (let i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); };
  const midnight = () => { const d = new Date(); d.setHours(24, 0, 0, 0); return d.getTime(); };
  const forget = () => { try { sessionStorage.removeItem(SK); localStorage.removeItem(RK); } catch (e) {} };
  function stored() { try {
    let s = sessionStorage.getItem(SK); if (s) { s = JSON.parse(s); if (s.s === P.s) return s.k; }
    let r = localStorage.getItem(RK); if (r) { r = JSON.parse(r); if (r.s === P.s && r.e > Date.now()) return r.k; localStorage.removeItem(RK); }
  } catch (e) {} return null; }
  function keep(k, remember) { try { sessionStorage.setItem(SK, JSON.stringify({ s:P.s, k })); if (remember) localStorage.setItem(RK, JSON.stringify({ s:P.s, k, e:midnight() })); } catch (e) {} }
  async function derive(p) { const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name:'PBKDF2', salt:ub(P.s), iterations:P.i, hash:'SHA-256' }, base, 256)); }
  async function open(raw) { const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']), d = ub(P.d);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv:d.slice(0, 12) }, key, d.slice(12))); }
  /* runs first inside the decrypted page: same-origin *.json requests are served from <name>.json.enc, decrypted with the same key */
  const boot = k => "<script>(function(){var k='" + k + "',K=null,of=window.fetch.bind(window);" +
    "function ub(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}" +
    "function key(){return K||(K=crypto.subtle.importKey('raw',ub(k),'AES-GCM',false,['decrypt']))}" +
    "window.fetch=function(u,o){var s=typeof u==='string'?u:(u&&u.url)||String(u),x;try{x=new URL(s,location.href)}catch(e){return of(u,o)}" +
    "if(x.origin!==location.origin||!/\\.json$/.test(x.pathname))return of(u,o);" +
    "return of(x.href.split('#')[0].split('?')[0]+'.enc',{cache:'no-store'}).then(function(r){if(!r.ok)return r;return r.arrayBuffer().then(function(b){var a=new Uint8Array(b);" +
    "return key().then(function(K){return crypto.subtle.decrypt({name:'AES-GCM',iv:a.slice(0,12)},K,a.slice(12))}).then(function(p){return new Response(p,{status:200,headers:{'Content-Type':'application/json'}})})})})};})();<\/script>";
  function show(html, k) { const m = /<head[^>]*>/i.exec(html), b = boot(k);
    html = m ? html.slice(0, m.index + m[0].length) + b + html.slice(m.index + m[0].length) : b + html;
    document.open(); document.write(html); document.close(); }

  let busy = false, done = false, tries = 0;
  const say = (msg, tone) => { status.textContent = msg; status.className = 'hql-status hql-mono' + (tone ? ' ' + tone : ''); };
  function paint() { const n = field.value.length;
    cells.forEach((c, i) => { c.classList.toggle('filled', i < n); c.classList.toggle('cur', i === n && !busy && !done); });
    goBtn.disabled = n !== 6 || busy || done; pwGo.disabled = busy || done; pw.disabled = busy || done; }
  function grant(html, k) { done = true; busy = false; lock.classList.remove('busy'); lock.classList.add('ok'); paint(); say('Access granted', 'ok');
    setTimeout(() => { lock.classList.add('gone'); setTimeout(() => show(html, k), reduce() ? 0 : 450); }, reduce() ? 0 : 380); }
  async function submit(value) {
    if (busy || done || !value) return;
    if (!(window.crypto && crypto.subtle)) { say('Open the site over https to unlock.', 'err'); return; }
    busy = true; lock.classList.add('busy'); paint(); say('Verifying clearance…');
    try { const raw = await derive(value), html = await open(raw), k = b64(raw); keep(k, rem.checked); grant(html, k); }
    catch (e) { busy = false; lock.classList.remove('busy'); field.value = ''; pw.value = ''; paint(); tries += 1;
      lock.classList.remove('err'); void lock.offsetWidth; lock.classList.add('err');
      say((codeMode ? 'Code' : 'Password') + ' rejected · ' + (tries > 1 ? 'attempt ' + tries : 'try again'), 'err');
      if (!coarse) (codeMode ? field : pw).focus(); }
  }
  function setCode(v) { if (busy || done) return; lock.classList.remove('err');
    field.value = String(v).replace(/\D/g, '').slice(0, 6);
    if (status.classList.contains('err') && field.value) say('Awaiting code');
    paint(); if (field.value.length === 6) submit(field.value); }

  field.addEventListener('input', () => setCode(field.value));
  field.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(field.value.length === 6 ? field.value : ''); } });
  $('hqlPad').addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (!b) return; const k = b.dataset.k;
    if (k === 'del') setCode(field.value.slice(0, -1)); else if (k === 'go') submit(field.value); else setCode(field.value + k); });
  $('hqlPwForm').addEventListener('submit', e => { e.preventDefault(); lock.classList.remove('err'); const v = pw.value; if (!v) { say('Enter the password.', 'err'); pw.focus(); return; } submit(v); });
  pw.addEventListener('input', () => { lock.classList.remove('err'); if (status.classList.contains('err')) say('Awaiting password'); });
  /* in code mode, typing anywhere goes into the code */
  document.addEventListener('keydown', e => {
    if (!codeMode || done || e.target === field || e.target === rem || e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^\d$/.test(e.key)) { e.preventDefault(); setCode(field.value + e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); setCode(field.value.slice(0, -1)); }
  }, true);

  if (/[?&]signout\b/.test(location.search)) { forget(); history.replaceState(null, '', location.pathname + location.hash); }
  if (!codeMode) say('Awaiting password');
  paint();
  const k0 = stored();
  if (k0) { busy = true; lock.classList.add('busy'); paint(); say('Resuming session…');
    const ready = new Promise(r => { if (document.readyState === 'complete') r(); else addEventListener('load', () => r()); });
    Promise.all([open(ub(k0)), ready]).then(x => setTimeout(() => { done = true; show(x[0], k0); }, 0),
      () => { forget(); busy = false; lock.classList.remove('busy'); paint(); say(codeMode ? 'Awaiting code' : 'Awaiting password'); if (!coarse) (codeMode ? field : pw).focus(); }); }
  else if (!coarse) (codeMode ? field : pw).focus();
})();
</script>
</body>
